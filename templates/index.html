<!DOCTYPE html>
<html>
    <head lang="es">
        <title>Problema del flujo máximo</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <link rel="icon" href="{{ url_for('static', filename='favicon.ico')}}">
        <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    </head>
    <body>
        <h1>Grafo</h1>

        <!-- Elegir modo -->
        <div id="elegir-modo">
            <button id="btn-aleatorio">Generar Aleatorio</button>
            <button id="btn-manual">Manual</button>
        </div>

        <!-- Modo aleatorio -->
        <div id="modo-aleatorio" style="display:none">
            <label for="n">Numero de nodos (7-16):</label>
            <input type="number" id="n" min="7" max="16" value="7">
            <button id="generar">Generar Grafo</button>
        </div>

        <!-- Modo manual -->
        <div id="modo-manual" style="display:none">
            <button id="agregar-nodo">Agregar Nodo</button>
            <button id="agregar-arista">Agregar Arista</button>
            <div id="form-arista" style="display:none">
                <select id="arista-origen"></select>
                <span>→</span>
                <select id="arista-destino"></select>
                <input type="number" id="arista-capacidad" min="1" value="1" placeholder="Capacidad">
                <button id="confirmar-arista">Agregar</button>
                <button id="cancelar-arista">Cancelar</button>
            </div>
            <button id="usar-red">Usar Red</button>
            <p id="info-manual"></p>
        </div>

        <!-- Grafo + algoritmo -->
        <div id="contenedor-grafo" style="display:none">
            <div id="grafo"></div>
            <button id="ejecutar">Ejecutar Ford-Fulkerson</button>
            <div id="navegacion">
                <button id="anterior" disabled>← Anterior</button>
                <span id="paso-info"></span>
                <button id="siguiente" disabled>Siguiente →</button>
            </div>
            <p id="descripcion"></p>
            <p id="flujo-maximo"></p>
        </div>

        <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
        <script src="{{url_for('static',filename='js/main.js')}}"></script>
    </body>
</html>
