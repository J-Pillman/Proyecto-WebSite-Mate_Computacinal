<!DOCTYPE html>
<html>
    <head lang="es">
        <title>Problema del flujo máximo</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <link rel="icon" href="{{ url_for('static', filename='favicon.ico')}}">
        <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    </head>
    <body>

        <div id="elegir-modo">
            <button id="btn-aleatorio">Generar Aleatorio</button>
            <button id="btn-manual">Manual</button>
        </div>

        <div id="modo-aleatorio" style="display:none">
            <label for="n">Numero de nodos (7-16):</label>
            <input type="number" id="n" min="7" max="16" value="7">
            <button id="generar">Generar Grafo</button>
            <button id="cancelar-aleatorio">Cancelar</button>
        </div>

        <div id="modo-manual" style="display:none">
            <button id="agregar-nodo">Agregar Nodo</button>
            <button id="agregar-arista">Agregar Arista</button>
            <div id="form-arista" style="display:none">
                <select id="arista-origen"></select>
                <span>→</span>
                <select id="arista-destino"></select>
                <input type="number" id="arista-capacidad" min="1" value="1" placeholder="Capacidad">
                <button id="confirmar-arista">Agregar</button>
                <button id="cancelar-arista">Cancelar</button>
            </div>
            <button id="usar-red">Usar Red</button>
            <button id="cancelar-manual">Cancelar</button>
            <p id="info-manual"></p>
        </div>

        <div id="grafo"></div>

        <div id="contenedor-algoritmo" style="display:none">
            <button id="ejecutar">Ejecutar Ford-Fulkerson</button>
            <button id="volver-edicion" style="background-color: #f59e0b;" style="display:none">Volver</button>
    
            <div id="pasos-algoritmo" style="display:none">
                <h2>3. Ejecución paso a paso</h2>
            <div id="navegacion">
                <button id="anterior" disabled>← Anterior</button>
                <span id="paso-info"></span>
                <button id="siguiente" disabled>Siguiente →</button>
                <button id="ir-final">Ir al final</button>
                <button id="reiniciar">Reiniciar</button>
            </div>

            <div id="progreso">
                <label>Flujo total</label>
                <div><b id="flujo-total-num">0</b> <span id="flujo-total-max"></span></div>
                <div id="barra"><i id="barra-fill"></i></div>
            </div>

            <div id="chips-container">
                <label>Caminos encontrados (entre paréntesis, lo que se envía por cada uno)</label>
                <div id="chips"></div>
            </div>

            <div>
                <b>Red con flujo</b>
                <span class="legend">En cada flecha: flujo/capacidad. Bajo cada nodo: de qué nodo se llega y cuánto más puede llegar.</span>
                <div id="grafo-pasos"></div>
            </div>

            <div id="leyenda">
            </div>

            <div id="paso-detalle"></div>
            </div>
        </div>

        <div id="resultado" style="display:none">
            <h2>4. Resultado</h2>
            <div id="resultado-contenido"></div>
        </div>

        <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
        <script src="{{url_for('static',filename='js/main.js')}}"></script>
    </body>
</html>
